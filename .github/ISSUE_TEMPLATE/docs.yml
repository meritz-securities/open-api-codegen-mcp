name: 명세·문서가 실제와 다릅니다
description: 도구가 돌려주는 명세나 README 의 설명이 실제 동작과 어긋나는 곳을 알려 주십시오.
labels:
- documentation
body:
- type: markdown
  attributes:
    value: |
      명세는 포털에 등록된 내용을 그대로 따릅니다. 다만 포털 요청 예시에 필수 파라미터가
      빠져 있어 그대로 쓰면 HTTP 500 이 나는 API 가 있고, 그런 지점은
      [`meritz_codegen/data/corrections.json`](https://github.com/meritz-securities/open-api-codegen-mcp/blob/main/meritz_codegen/data/corrections.json) 에
      모아 두고 있습니다. 새로 찾으신 차이를 알려 주시면 그곳에 반영하겠습니다.

      **앱키·시크릿·접근토큰·계좌번호는 넣지 말아 주십시오.**
- type: dropdown
  id: kind
  attributes:
    label: 어떤 종류의 차이입니까
    options:
    - 포털 명세와 실제 응답이 다릅니다 (corrections 에 넣을 내용)
    - get_api_detail 이 알려 준 내용이 실제와 다릅니다
    - 검색으로 원하는 API 가 나오지 않습니다
    - README 의 설명이 실제 동작과 다릅니다
    - 설명이 없어서 알기 어려웠습니다
    - 오탈자·깨진 링크
  validations:
    required: true
- type: input
  id: location
  attributes:
    label: 어디입니까
    description: 도구 이름과 `api_type`, 또는 README 의 절 제목을 적어 주십시오.
    placeholder: get_api_detail('ovs_market_prices') / README.md "포털 예시가 실제와 다를 때"
  validations:
    required: true
- type: input
  id: api-path
  attributes:
    label: 관련된 API 경로
    placeholder: /market/v1/overseas/prices
  validations:
    required: false
- type: textarea
  id: documented
  attributes:
    label: 명세에는 이렇게 되어 있습니다
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제로는 이렇습니다
    description: 확인하신 방법도 함께 적어 주시면 좋습니다. 응답을 옮기실 때 계좌 정보는 지워 주십시오.
  validations:
    required: true
- type: dropdown
  id: server
  attributes:
    label: 어떻게 확인하셨습니까
    description: 이 저장소가 다루는 대상은 운영 서버(https://openapi.imeritz.com:9443)뿐입니다.
    options:
    - 운영 서버에서 실제로 호출해 보았습니다
    - 실행하지 않고 명세만 보았습니다
  validations:
    required: true
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
