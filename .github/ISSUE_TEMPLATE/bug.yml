name: 만들어 준 코드나 검색이 이상합니다
description: 코드 생성·검색·명세 조회에서 생긴 문제를 알려 주십시오.
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      ## 붙여넣기 전에 한 번만 확인해 주십시오

      **앱키(App Key)·시크릿(App Secret)·접근토큰·계좌번호를 이 화면에 넣지 마십시오.**
      이 서버 자체는 앱키를 쓰지 않지만, 만들어 드린 코드를 **실행해 보신 결과**를
      옮기실 때 자격증명이나 계좌 정보가 함께 딸려 오기 쉽습니다.
      이슈는 누구나 볼 수 있고, 지우셔도 수정 이력에 남습니다.

      - 앱키·시크릿·접근토큰 → `***`
      - 계좌번호 → `***`
      - 실행 결과에 담긴 잔고·보유종목·주문번호 → 지우시거나 임의의 값으로 바꿔 주십시오

      이미 노출하셨다면 개발자 포털에서 **즉시 재발급**해 주십시오.

      ---

      주문이 나가지 않았다거나 잔고가 다르게 보이는 등 **계좌·거래에 관한 문의는
      이곳에서 처리해 드릴 수 없습니다.** 개발자 포털의 문의 채널을 이용해 주십시오.
- type: textarea
  id: what-happened
  attributes:
    label: 무슨 일이 있었습니까
    description: 무엇을 요청하셨고, 기대와 달리 어떤 결과를 받으셨는지 적어 주십시오.
    placeholder: |
      generate_code 로 받은 코드를 그대로 실행했더니 필수 파라미터가 빠졌다는 오류가 납니다.
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 재현 방법
    description: |
      저희가 그대로 따라 할 수 있도록, 부르신 도구와 넘기신 값을 순서대로 적어 주십시오.

      예를 들면 이런 식입니다 — search_api("해외 주문 취소") → generate_code("...") → 만들어진 코드를 실행 → 아래 오류가 납니다
    render: shell
  validations:
    required: true
- type: dropdown
  id: client
  attributes:
    label: 어느 클라이언트에 붙이셨습니까
    options:
    - Claude Desktop
    - Claude Code
    - ChatGPT Desktop
    - Cursor
    - VS Code
    - Codex CLI
    - Gemini CLI
    - 그 밖의 MCP 클라이언트
  validations:
    required: true
- type: dropdown
  id: install
  attributes:
    label: 어떻게 설치하셨습니까
    options:
    - 설치 파일(.mcpb) 을 내려받아 더블클릭
    - uvx 로 실행 (claude mcp add / codex mcp add 등)
    - 설정 파일에 직접 적어 넣음
    - 저장소를 내려받아 직접 실행
  validations:
    required: false
- type: dropdown
  id: tool
  attributes:
    label: 어떤 도구에서 났습니까
    options:
    - generate_code — 호출 코드 생성
    - search_api — 검색
    - get_api_detail — 경로·파라미터·응답 필드
    - list_categories — 분류와 건수
    - api_conventions — 인증·호출 규약
    - 도구를 부르기 전에 서버가 뜨지 않았습니다
  validations:
    required: true
- type: input
  id: api-type
  attributes:
    label: 넘기신 api_type 또는 검색어
    description: 문제가 된 요청에 넣으신 값을 그대로 적어 주십시오. 아시면 API 경로도 함께 적어 주시면 좋습니다.
    placeholder: market_prices (/market/v1/prices)
  validations:
    required: false
- type: dropdown
  id: server
  attributes:
    label: 만들어진 코드를 실행해 보셨습니까
    description: 생성물은 운영 서버(https://openapi.imeritz.com:9443)만 향합니다.
    options:
    - 운영 서버에서 실행해 보았습니다
    - 실행하지 않고 코드만 보았습니다
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: 서버 버전
    description: 설치 파일로 넣으셨다면 그 버전을, 저장소에서 실행하셨다면 커밋 해시를 적어 주십시오.
    placeholder: 0.1.0 / 1a2b3c4
  validations:
    required: true
- type: input
  id: python-version
  attributes:
    label: 파이썬 버전
    description: '`python --version` 결과입니다. 3.11 이상이 필요합니다.'
    placeholder: Python 3.11.9
  validations:
    required: false
- type: input
  id: os
  attributes:
    label: 운영체제
    placeholder: macOS 14.5 / Windows 11 / Ubuntu 22.04
  validations:
    required: false
- type: textarea
  id: generated
  attributes:
    label: 만들어진 코드에서 문제가 된 부분
    description: 문제가 된 대목만 잘라 넣어 주십시오. 실행 결과를 함께 넣으실 때는 자격증명과 계좌 정보를 반드시 지워 주십시오.
    render: python
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 붙여넣은 실행 결과에서 잔고·보유종목·주문번호 등 계좌 정보를 지웠습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 서버 소프트웨어에 관한 문제입니다.
      required: true
