name: 이런 기능이 있었으면 합니다
description: 코드 생성·검색에 대한 제안을 남겨 주십시오.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |
      제안하시기 전에 한 가지만 알려 드립니다.

      **주문·환전 코드에 들어가는 확인 단계(`confirm=True`)는 빼지 않습니다.**
      그 단계를 없애 달라는 제안은 받지 않습니다.

      API 자체에 새 기능이 필요하신 경우에는 이곳이 아니라 개발자 포털로 보내 주십시오.
- type: textarea
  id: problem
  attributes:
    label: 어떤 점이 아쉬우셨습니까
    description: 어떤 코드를 받고 싶으셨는데 무엇이 부족했는지 적어 주십시오.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: 어떻게 되면 좋겠습니까
    description: 원하시는 코드의 모양이 있으시면 함께 적어 주십시오.
  validations:
    required: true
- type: dropdown
  id: tool
  attributes:
    label: 어느 도구와 관련이 있습니까
    options:
    - generate_code — 호출 코드 생성
    - search_api — 검색
    - get_api_detail — 경로·파라미터·응답 필드
    - list_categories — 분류와 건수
    - api_conventions — 인증·호출 규약
    - 설치·설정에 관한 것입니다
    - 새로운 도구가 필요합니다
  validations:
    required: true
- type: input
  id: api-type
  attributes:
    label: 관련된 api_type 또는 API 경로
    placeholder: market_prices (/market/v1/prices)
  validations:
    required: false
- type: dropdown
  id: client
  attributes:
    label: 어느 클라이언트에서 쓰고 계십니까
    options:
    - Claude Desktop
    - Claude Code
    - ChatGPT Desktop
    - Cursor
    - VS Code
    - Codex CLI
    - Gemini CLI
    - 그 밖의 MCP 클라이언트
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 비슷한 제안이 이미 올라와 있는지 찾아보았습니다.
      required: false
    - label: 주문·환전 코드의 확인 단계를 빼자는 제안이 아닙니다.
      required: true
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
